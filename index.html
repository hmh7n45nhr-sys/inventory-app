<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>業務用 賞味期限・在庫管理</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#111827;color:white;padding:15px 16px;font-weight:800;font-size:19px;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0001}
h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}
input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #d1d5db}
input,select{width:100%;background:#fff}
button{background:#111827;color:white;border:0;font-weight:800;cursor:pointer}
button.green{background:#15803d}.gray{background:#6b7280}.red{background:#b91c1c}.blue{background:#2563eb}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#reader{max-width:520px;margin:12px auto}.hidden{display:none}
.status{background:#eef6ff;border-radius:10px;padding:10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f9fafb;border-radius:10px;padding:9px}.stat b{font-size:20px;display:block}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:680px}
th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;white-space:nowrap}
th{background:#f9fafb;position:sticky;top:0}.expired{background:#fee2e2}.soon{background:#ffedd5}.ok{background:#ecfdf5}
.badge{padding:3px 6px;border-radius:6px;font-size:11px;font-weight:800}.badge.red{color:white}.badge.orange{background:#f59e0b;color:white}.badge.green{background:#16a34a;color:white}
.small{font-size:12px;color:#6b7280}
@media(max-width:600px){.grid,.actions,.stats,.toolbar{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header>📦 業務用・賞味期限／在庫管理</header>
<main>

<div class="card">
<h2>① 基本情報</h2>
<div class="grid">
<div><label>得意先・店舗</label><input id="customer" placeholder="例：○○店"></div>
<div><label>担当者</label><input id="staff" placeholder="例：渡邊"></div>
</div>
</div>

<div class="card">
<h2>② 商品登録</h2>
<button id="scanBtn" class="blue">📷 JANバーコードを読み取る</button>
<div id="reader" class="hidden"></div>
<div id="status" class="status" style="margin-top:10px">バーコードを読み取ってください。</div>

<div class="grid">
<div><label>JANコード</label><input id="jan" inputmode="numeric"></div>
<div><label>商品名</label><input id="name" placeholder="商品名"></div>
<div><label>賞味期限</label><input id="expiry" type="date"></div>
<div><label>数量</label><input id="qty" type="number" min="1" step="1" value="1"></div>
</div>
<div class="actions">
<button id="addBtn" class="green">＋ 登録</button>
<button id="clearBtn" class="gray">入力クリア</button>
<button id="repeatBtn" class="blue">同商品＋1</button>
</div>
<p class="small">同じJANコード・同じ賞味期限の商品を登録すると、自動で数量を合算します。</p>
</div>

<div class="card">
<h2>③ 現在の集計</h2>
<div class="stats">
<div class="stat">商品種類<b id="count">0</b></div>
<div class="stat">総数量<b id="total">0</b></div>
<div class="stat">30日以内<b id="soonCount">0</b></div>
<div class="stat">期限切れ<b id="expiredCount">0</b></div>
</div>
</div>

<div class="card">
<h2>④ 在庫一覧</h2>
<div class="toolbar">
<input id="search" placeholder="商品名・JANで検索">
<select id="filter"><option value="all">すべて</option><option value="expired">期限切れ</option><option value="soon">30日以内</option><option value="ok">31日以上</option></select>
</div>
<div class="tablewrap" style="margin-top:10px">
<table><thead><tr><th>店舗</th><th>JAN</th><th>商品名</th><th>賞味期限</th><th>数量</th><th>状態</th><th>操作</th></tr></thead>
<tbody id="list"></tbody></table>
</div>
</div>

<div class="card">
<h2>⑤ Excel出力</h2>
<div class="actions">
<button id="exportBtn" class="green">📊 Excel出力</button>
<button id="csvBtn" class="blue">CSV出力</button>
<button id="clearAllBtn" class="red">全データ削除</button>
</div>
<p class="small">Excelには「店舗・担当者・JANコード・商品名・賞味期限・数量・状態・確認日」を出力します。</p>
</div>

</main>
<script>
let items=JSON.parse(localStorage.getItem("biz_inventory")||"[]"),scanner=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("biz_inventory",JSON.stringify(items));render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function days(exp){return Math.ceil((new Date(exp+"T00:00:00")-new Date(new Date().toDateString()))/86400000)}
function state(exp){let d=days(exp);return d<0?"expired":d<=30?"soon":"ok"}
function stateText(exp){let d=days(exp);return d<0?`期限切れ（${Math.abs(d)}日）`:d<=30?`残り${d}日`:"31日以上"}
function render(){
 let q=$("search").value.trim().toLowerCase(), f=$("filter").value;
 let filtered=items.filter(x=>(!q||(x.jan+" "+x.name).toLowerCase().includes(q))&&(f==="all"||state(x.expiry)===f));
 $("list").innerHTML=filtered.map((x,i)=>{
   let s=state(x.expiry);
   let real=items.indexOf(x);
   return `<tr class="${s}"><td>${esc(x.customer)}</td><td>${esc(x.jan)}</td><td>${esc(x.name)}</td><td>${esc(x.expiry)}</td><td>${x.qty}</td><td><span class="badge ${s==="expired"?"red":s==="soon"?"orange":"green"}">${stateText(x.expiry)}</span></td><td><button class="red" style="padding:6px" onclick="del(${real})">削除</button></td></tr>`
 }).join("");
 $("count").textContent=items.length;$("total").textContent=items.reduce((a,x)=>a+x.qty,0);
 $("soonCount").textContent=items.filter(x=>state(x.expiry)==="soon").length;
 $("expiredCount").textContent=items.filter(x=>state(x.expiry)==="expired").length;
}
function clearInput(){["jan","name","expiry"].forEach(id=>$(id).value="");$("qty").value=1}
function del(i){if(confirm("この商品を削除しますか？")){items.splice(i,1);save()}}
async function scan(){
 $("reader").classList.remove("hidden");$("status").textContent="カメラ起動中…";
 if(scanner)return; scanner=new Html5Qrcode("reader");
 try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:290,height:120}},
 async code=>{ $("jan").value=code;$("status").textContent="読み取り："+code;
   try{await scanner.stop()}catch(e){} $("reader").classList.add("hidden");scanner=null;
   $("name").focus();
 },()=>{})}
 catch(e){$("status").textContent="カメラを起動できません。HTTPSとカメラ権限を確認してください。";$("reader").classList.add("hidden");scanner=null}
}
$("scanBtn").onclick=scan;
$("addBtn").onclick=()=>{
 let customer=$("customer").value.trim(),staff=$("staff").value.trim(),jan=$("jan").value.trim(),name=$("name").value.trim(),expiry=$("expiry").value,qty=Number($("qty").value);
 if(!jan)return alert("JANコードを入力してください");if(!expiry)return alert("賞味期限を入力してください");if(!Number.isInteger(qty)||qty<1)return alert("数量を確認してください");
 let same=items.find(x=>x.customer===customer&&x.jan===jan&&x.expiry===expiry);
 if(same){same.qty+=qty;same.staff=staff}else items.push({customer,staff,jan,name,expiry,qty,checkDate:new Date().toISOString().slice(0,10)});
 save();clearInput();$("status").textContent="登録しました。次の商品を読み取れます。";
};
$("repeatBtn").onclick=()=>{$("qty").value=Number($("qty").value||0)+1};
$("clearBtn").onclick=clearInput;$("search").oninput=render;$("filter").onchange=render;
$("clearAllBtn").onclick=()=>{if(confirm("全データを削除しますか？")){items=[];save()}};
function rows(){return items.map(x=>({"店舗":x.customer,"担当者":x.staff,"JANコード":x.jan,"商品名":x.name,"賞味期限":x.expiry,"数量":x.qty,"状態":stateText(x.expiry),"確認日":x.checkDate}))}
$("exportBtn").onclick=()=>{if(!items.length)return alert("データがありません");let ws=XLSX.utils.json_to_sheet(rows()),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"在庫一覧");XLSX.writeFile(wb,`賞味期限在庫_${new Date().toISOString().slice(0,10)}.xlsx`)};
$("csvBtn").onclick=()=>{if(!items.length)return alert("データがありません");let ws=XLSX.utils.json_to_sheet(rows()),csv=XLSX.utils.sheet_to_csv(ws);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=`賞味期限在庫_${new Date().toISOString().slice(0,10)}.csv`;a.click()};
render();
</script>
</body></html>
